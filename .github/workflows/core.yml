name: 音声コアのビルド
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/core.Dockerfile
          outputs: type=local,dest=vendor/core
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: audio-core
          path: vendor/core
          retention-days: 30
