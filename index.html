  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body id="codec-compact">
  <header class="cc-header">
    <img class="cc-mark" src="./icon.svg" width="24" height="24" alt=""><h1>ききくらべ</h1>
    <nav class="cc-header-links" aria-label="関連リンク">
      <a href="https://markn2000.com/" target="_blank" rel="noopener noreferrer" title="ホームページ（別タブで開く）">ホームページ</a>

    </nav>
  </header>
  <main>
    <section class="cc-player" aria-label="音源とプレーヤー">
      <button class="cc-play cc-primary" id="play" aria-label="再生" disabled><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M6 3 21 12 6 21Z"/></svg></button>
      <span class="cc-filename" id="filename">音源を選択、またはここにドロップ</span>
      <button class="cc-loop" id="loop" aria-label="ループ再生" aria-pressed="false" title="ループ再生：オフ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4M21 6H7a4 4 0 0 0-4 4m4 12-4-4 4-4M3 18h14a4 4 0 0 0 4-4"/></svg></button>
      <button class="cc-change" id="change">音源変更</button>
      <div class="cc-source-info" id="source-info"><span>音声はブラウザ内で処理します</span></div>
      <div class="cc-seek-row"><span id="position">00:00</span><input class="cc-seek" id="seek" type="range" min="0" max="0" value="0" step="0.01" aria-label="再生位置" disabled><span id="duration">00:00</span></div>
      <input id="file" type="file" accept="audio/*,.opus,.ogg,.flac,.wav,.m4a,.aac,.aif,.aiff,.sbc,.lc3" aria-label="音源ファイル" hidden>
    </section>
    <section class="cc-comparison" aria-label="比較パターン">
      <div class="cc-toolbar"><h2>比較パターン</h2><button class="cc-primary" id="add" disabled><span aria-hidden="true">＋</span>追加</button></div>
      <form class="cc-editor" id="editor" aria-label="パターン設定" hidden>
        <div class="cc-editor-heading"><h2 id="editor-title">パターンを追加</h2><button type="button" class="cc-icon" data-close aria-label="設定を閉じる">×</button></div>
        <div class="cc-fields" id="fields"></div>
        <div class="cc-editor-buttons"><button type="button" data-close>キャンセル</button><button type="submit" class="cc-primary">変換</button></div>
      </form>
      <div class="cc-table-head" aria-hidden="true"><span>音声・設定</span><span>サイズ</span><span>実効レート</span><span>基準PCM比 / 削減率</span><span></span></div>
      <div class="cc-patterns" id="patterns"><p class="cc-empty">音源を選択すると比較できます。</p></div>
    </section>
    <details class="cc-graph" id="graph">
      <summary>グラフで比較</summary>
      <div class="cc-graph-content">
        <div class="cc-graph-legend"><span class="cc-graph-reference">基準PCM</span><span id="graph-selected">選択中</span></div>
        <div id="graph-plots" hidden>
          <h3>周波数</h3>
          <canvas id="frequency-canvas" role="img" aria-label="周波数スペクトル"></canvas>
          <h3>時間×周波数の差分</h3>
          <canvas id="graph-canvas" role="img" aria-label="時間×周波数の差分"></canvas>
        </div>
        <p id="graph-status" role="status">音源を選択すると比較できます。</p>
      </div>
    </details>
    <div class="cc-notice" id="notice" role="status" aria-live="polite" hidden></div>
    <noscript>JavaScriptを有効にしてください。</noscript>
  </main>
</body>
</html>
